[package]
name = "dioxus-sdk-push"
version = "0.7.0"

description = "Remote push notifications (FCM / APNs / Web Push / desktop fallback) and server-side sending helpers for Dioxus."
readme = "./README.md"
keywords = ["gui", "dioxus", "push", "fcm", "apns"]
categories = ["gui", "api-bindings"]

edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = ["client"]
client = []
server = [
    "dep:reqwest",
    "dep:serde_json",
    "dep:jsonwebtoken",
    "dep:gcp_auth",
    "dep:a2",
    "dep:web-push",
    "dep:thiserror",
    "dep:async-trait",
    "tokio/rt",
    "tokio/macros",
]
redis = ["server", "dep:redis"]

[dependencies]
# Always-available, wasm-safe shared deps.
dioxus = { workspace = true }
cfg-if = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0", optional = true }
# `sync` is wasm-safe and used by the client channel + server hub.
tokio = { workspace = true, features = ["sync"] }

# ---- Web (wasm) client ----
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.50"
js-sys = { workspace = true }
serde_json = "1.0"
web-sys = { workspace = true, features = [
    "Window",
    "Navigator",
    "ServiceWorkerContainer",
    "ServiceWorkerRegistration",
    "PushManager",
    "PushSubscription",
    "PushSubscriptionJson",
    "PushSubscriptionOptionsInit",
    "Notification",
    "NotificationPermission",
    "MessageEvent",
] }

# ---- Android (FCM) client ----
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"
serde_json = "1.0"
# The Kotlin bridge is driven through `dioxus::mobile::wry`'s JNI dispatcher.
dioxus = { workspace = true, features = ["mobile"] }
# Embeds Android plugin metadata (via `#[manganis::ffi]`) so `dx` >= 0.7.9
# auto-bundles the `kotlin/` module into the generated Android project.
manganis = "0.7.9"

# ---- Apple (APNs) client: macOS + iOS shared ----
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6.1"
objc2-foundation = { version = "0.3.1", features = [
    "NSData",
    "NSString",
    "NSDictionary",
    "NSError",
    "NSObject",
] }
objc2-user-notifications = { version = "0.3.1", features = [
    "UNUserNotificationCenter",
    "UNNotificationSettings",
    "UNNotification",
    "UNNotificationRequest",
    "UNNotificationContent",
    "UNNotificationResponse",
    "block2",
] }
block2 = "0.6.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3.1", features = ["UIApplication"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.1", features = ["NSApplication"] }

# ---- Desktop fallback (Windows/Linux) client: live WS + local toast ----
[target.'cfg(all(not(target_family = "wasm"), any(target_os = "windows", target_os = "linux")))'.dependencies]
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
dioxus-sdk-notification = { workspace = true }
serde_json = "1.0"
uuid = { version = "1", features = ["v4"] }

# ---- Server-side sending helpers + hub: host-only, opt-in via `server` ----
[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
], optional = true }
jsonwebtoken = { version = "9.3", optional = true }
gcp_auth = { version = "0.12", optional = true }
a2 = { version = "0.10", default-features = false, features = [
    "ring",
], optional = true }
web-push = { version = "0.10", default-features = false, features = [
    "hyper-client",
], optional = true }
async-trait = { version = "0.1", optional = true }
thiserror = { version = "2.0", optional = true }
redis = { version = "0.27", default-features = false, features = [
    "tokio-comp",
    "tokio-rustls-comp",
    "connection-manager",
], optional = true }

[dev-dependencies]
serde_json = "1.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
