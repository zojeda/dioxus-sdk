[package]
name = "push-example"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { workspace = true }
dioxus-sdk-push = { workspace = true, features = ["client"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"], optional = true }

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
# Build the server demo binaries (examples/push/src/bin/{send,hub}.rs).
server = ["dioxus-sdk-push/server", "dep:tokio"]
redis = ["server", "dioxus-sdk-push/redis"]
